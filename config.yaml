baseURL: https://christophervikner.se/

languageCode: en-us
theme: toha-3.8.0

title: "Code and Crayons"

# Publish the approved resume at its existing download URL.
module:
  mounts:
    - source: static
      target: static
    - source: files
      target: static/files
      includeFiles: resume.pdf

markup:
  goldmark:
    renderer:
      unsafe: true

# At least HTML and JSON are required for the main HTML content and
# client-side JavaScript search
outputs:
  home:
    - HTML
    - RSS
    - JSON



# Site parameters
params:
  background: "images/slategray_bg.jpg"

  customMenus:
    - name: Portfolio
      url: /portfolio/
      showOnFooter: true
    - name: Contact
      url: /contact/
      showOnFooter: true

  # Configure the number of section title visible in the top navbar
  topNavbar:
    maxVisibleSections: 5

  newsletter:
    enable: false

  # Configure various features of this theme
  darkMode:
    enable: true
    provider: darkreader
    default: dark
