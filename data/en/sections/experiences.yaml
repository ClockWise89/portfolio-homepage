    overview: As an iOS developer contractor at HiQ Gothenburg, I work on navigation and connected-vehicle projects using modern Apple technologies and CarPlay.
  positions:
  - designation: Senior iOS Developer (Contract)
    start: Sep 2023
    responsibilities:
    - "Project 1: An electric-vehicle navigation companion app for a global automotive OEM, using Swift, SwiftUI, Kotlin, KMM, CarPlay, HERE SDK and the Iternio EV Planning API."
    - Worked with the manufacturer's vehicle ecosystem on battery-consumption estimates, charging-cost estimates along planned routes and vehicle-state push notifications. Networking and some business logic were shared with Android through KMM.
    - "Project 2 (current): A connected-vehicle companion app for an EV manufacturer startup in Saudi Arabia, through HiQ and WirelessCar, using Swift, SwiftUI, Godot 4, GDScript and OpenAPI."
    - Work across the native iOS app and its connections to shared modules and connected-vehicle services.
    - Built and delivered the Godot-based 3D vehicle experience independently, integrating the Godot runtime into iOS and building an OpenAPI-based bridge between Swift and Godot to display live vehicle data.
    - Use agentic tooling and AI-first development with Codex and MCP.
