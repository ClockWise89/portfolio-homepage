<section class="sidebar-section" id="sidebar-section">
  <div class="sidebar-holder">
    <div class="sidebar" id="sidebar">
      <form class="mx-auto" method="get" action="{{ "search" | relLangURL }}">
        <input type="text" name="keyword" placeholder="{{ i18n "search" }}" id="search-box" />
      </form>
      <div class="sidebar-tree">
        <ul class="tree" id="tree">
          <li id="list-heading"><a href="{{ "/portfolio/" | relLangURL }}">Portfolio</a></li>
          {{ with site.GetPage "/portfolio" }}
            {{ range .RegularPages.ByWeight }}
              <li><a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $.RelPermalink }} aria-current="page"{{ end }}>{{ .Title }}</a></li>
            {{ end }}
          {{ end }}
          <li><a href="{{ "/about/" | relLangURL }}">About</a></li>
          <li><a href="{{ "/expertise/" | relLangURL }}">Expertise</a></li>
          <li><a href="{{ "/contact/" | relLangURL }}">Contact</a></li>
        </ul>
      </div>
    </div>
  </div>
</section>
