{{ define "header" }}
<link rel="stylesheet" href="{{ "/css/layouts/list.css" | relURL }}">
<link rel="stylesheet" href="{{ "/css/navigators/sidebar.css" | relURL }}">
<link rel="stylesheet" href="{{ "/css/style.css" | relURL }}">
<link rel="stylesheet" href="{{ "/css/portfolio.css" | relURL }}">
{{ end }}

{{ define "navbar" }}{{ partial "navigators/navbar-2.html" . }}{{ end }}
{{ define "sidebar" }}{{ partial "portfolio/sidebar.html" . }}{{ end }}

{{ define "content" }}
<section class="content-section" id="content-section">
  <div class="content container-fluid" id="content">
    <div class="container-fluid post-card-holder" id="post-card-holder">
      <div id="search-results">
        <script id="search-result-template" type="text/x-js-template">
          <div class="post-card">
            <div class="card">
              <a href="${link}" class="post-card-link">
                <div class="card-head"><img class="card-img-top" src="${hero}" alt=""></div>
                <div class="card-body">
                  <h5 class="card-title">${title}</h5>
                  <p class="card-text post-summary" id="summary-${key}">${summary}</p>
                </div>
              </a>
              <div class="card-footer">
                <span class="float-left">${date}</span>
                <a href="${link}" class="float-right btn btn-outline-info btn-sm">Read</a>
              </div>
            </div>
          </div>
        </script>
      </div>
    </div>
  </div>
</section>
{{ end }}

{{ define "scripts" }}
<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/3.2.0/fuse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mark.js/8.11.1/jquery.mark.min.js"></script>
<script src="{{ "/js/search.js" | relURL }}"></script>
{{ end }}
